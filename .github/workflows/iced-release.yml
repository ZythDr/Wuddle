name: Iced Release Build

on:
  push:
    tags:
      - "v*"
    branches:
      - "v3.7.0-beta.7-testing"

permissions:
  contents: read

env:
  # Branch-only test builds use the final intended package identity so their
  # portable layout matches the release users will receive. Only tag runs may
  # publish a GitHub Release.
  WUDDLE_BUILD_TAG: ${{ github.ref_type == 'branch' && 'v3.7.0-beta.7' || github.ref_name }}

concurrency:
  group: iced-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Guard: build tags from main, plus prerelease tags from beta. This keeps
  # the Iced workflow separate from stable Tauri tags while allowing testers
  # to receive packaged beta updates.
  # ------------------------------------------------------------------
  guard:
    name: Check release tag branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "branch" && \
                "${GITHUB_REF_NAME}" == "v3.7.0-beta.7-testing" ]]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "Building branch-only beta.7 test artifacts; no GitHub Release will be published."
            exit 0
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/beta:refs/remotes/origin/beta
          TAG_SHA="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          ON_MAIN=false
          ON_BETA_PRERELEASE=false
          if git show-ref --verify --quiet refs/remotes/origin/main && \
             git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            ON_MAIN=true
          fi
          if [[ "${GITHUB_REF_NAME}" == *-* ]] && \
             git show-ref --verify --quiet refs/remotes/origin/beta && \
             git merge-base --is-ancestor "${TAG_SHA}" origin/beta; then
            ON_BETA_PRERELEASE=true
          fi
          if [[ "${ON_MAIN}" == true || "${ON_BETA_PRERELEASE}" == true ]]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${GITHUB_REF_NAME} is on a release branch — building Iced release."
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "Tag ${GITHUB_REF_NAME} is not on main or beta prerelease — skipping Iced build."
          fi

  validate-release:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Install frontend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            pkg-config

      - name: Validate tag and release metadata
        run: python3 .github/scripts/validate_release.py "${WUDDLE_BUILD_TAG}"

      - name: Test release validator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run complete test suite
        run: |
          cargo test --locked --manifest-path wuddle-engine/Cargo.toml
          cargo test --locked --manifest-path wuddle-engine/Cargo.toml --features auto-login
          cargo test --locked --manifest-path wuddle-iced/Cargo.toml
          cargo check --locked --manifest-path wuddle-iced/Cargo.toml --no-default-features
          cargo test --locked --manifest-path wuddle-launcher/Cargo.toml

      - name: Check formatting
        run: |
          cargo fmt --manifest-path wuddle-engine/Cargo.toml --all -- --check
          cargo fmt --manifest-path wuddle-iced/Cargo.toml --all -- --check
          cargo fmt --manifest-path wuddle-launcher/Cargo.toml --all -- --check

  # ------------------------------------------------------------------
  # Linux portable tar.gz
  # ------------------------------------------------------------------
  build-linux:
    needs: [guard, validate-release]
    if: needs.guard.outputs.should_build == 'true'
    name: Linux (portable tar.gz)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            wuddle-iced -> target
            wuddle-engine -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libfuse2 \
            pkg-config

      - name: Build Wuddle (Iced)
        run: cargo build --locked --release --manifest-path wuddle-iced/Cargo.toml

      - name: Show sccache stats
        run: ${SCCACHE_PATH} --show-stats || true

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          TAG="${WUDDLE_BUILD_TAG}"
          LINUXDEPLOY_TAG="1-alpha-20251107-1"
          LINUXDEPLOY_SHA256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
          APPIMAGE_PLUGIN_TAG="1-alpha-20250213-1"
          APPIMAGE_PLUGIN_SHA256="992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3"

          wget -qO linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          wget -qO linuxdeploy-plugin-appimage.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/${APPIMAGE_PLUGIN_TAG}/linuxdeploy-plugin-appimage-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy.AppImage" | sha256sum --check
          echo "${APPIMAGE_PLUGIN_SHA256}  linuxdeploy-plugin-appimage.AppImage" | sha256sum --check
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage.AppImage

          cp wuddle-iced/assets/wuddle.desktop wuddle.desktop

          # linuxdeploy infers the icon name from the filename, so it must
          # be named wuddle.png to match the Icon= entry in the desktop file.
          cp wuddle-iced/assets/icons/128x128.png wuddle.png

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable wuddle-iced/target/release/wuddle \
            --desktop-file wuddle.desktop \
            --icon-file wuddle.png \
            --output appimage

          mv Wuddle-x86_64.AppImage "wuddle-${TAG}-linux-x86_64.AppImage"

      - name: Package portable tar.gz
        run: |
          set -euo pipefail
          TAG="${WUDDLE_BUILD_TAG}"
          mkdir -p dist
          cp wuddle-iced/target/release/wuddle dist/wuddle-bin
          chmod +x dist/wuddle-bin
          mkdir -p dist/share/applications dist/share/icons/hicolor/128x128/apps
          cp wuddle-iced/assets/wuddle.desktop dist/share/applications/wuddle.desktop
          cp wuddle-iced/assets/icons/128x128.png dist/share/icons/hicolor/128x128/apps/wuddle.png

          cat > dist/wuddle << 'LAUNCH'
          #!/usr/bin/env bash
          set -euo pipefail
          SELF="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          BIN="${SELF}/wuddle-bin"
          if [[ ! -x "${BIN}" ]]; then
            echo "ERROR: ${BIN} not found" >&2
            exit 1
          fi
          if [[ "${WUDDLE_FORCE_X11:-0}" == "1" ]]; then
            exec env WINIT_UNIX_BACKEND=x11 "${BIN}" "$@"
          fi
          exec "${BIN}" "$@"
          LAUNCH
          chmod +x dist/wuddle

          cat > dist/install-desktop-entry << 'INSTALL'
          #!/usr/bin/env bash
          set -euo pipefail
          SELF="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          DATA_HOME="${XDG_DATA_HOME:-${HOME}/.local/share}"
          APPLICATIONS_DIR="${DATA_HOME}/applications"
          ICON_DIR="${DATA_HOME}/icons/hicolor/128x128/apps"
          mkdir -p "${APPLICATIONS_DIR}" "${ICON_DIR}"
          cp "${SELF}/share/icons/hicolor/128x128/apps/wuddle.png" "${ICON_DIR}/wuddle.png"
          {
            echo '[Desktop Entry]'
            echo 'Name=Wuddle'
            echo 'Comment=Launcher and manager for legacy World of Warcraft clients'
            printf 'Exec="%s/wuddle"\n' "${SELF}"
            echo 'Icon=wuddle'
            echo 'Terminal=false'
            echo 'Type=Application'
            echo 'Categories=Game;Utility;'
            echo 'StartupNotify=true'
            echo 'StartupWMClass=wuddle'
          } > "${APPLICATIONS_DIR}/wuddle.desktop"
          echo "Installed ${APPLICATIONS_DIR}/wuddle.desktop"
          INSTALL
          chmod +x dist/install-desktop-entry

          cat > dist/README.txt << 'DOC'
          Wuddle Linux Portable (Iced v3)
          =====================================
          Run:        ./wuddle
          Force X11:  WUDDLE_FORCE_X11=1 ./wuddle
          App menu:   ./install-desktop-entry

          App data: ~/.local/share/wuddle  (shared with Wuddle v2 — no migration needed)
          DOC

          tar -C dist -czf "wuddle-${TAG}-linux-x86_64.tar.gz" .

      - name: Smoke-test Linux packages
        run: |
          set -euo pipefail
          TAG="${WUDDLE_BUILD_TAG}"
          test -s "wuddle-${TAG}-linux-x86_64.AppImage"
          test -x "wuddle-${TAG}-linux-x86_64.AppImage"
          "./wuddle-${TAG}-linux-x86_64.AppImage" --appimage-version
          tar -tzf "wuddle-${TAG}-linux-x86_64.tar.gz" > package-contents.txt
          grep -Fx './install-desktop-entry' package-contents.txt
          grep -Fx './share/applications/wuddle.desktop' package-contents.txt
          grep -Fx './share/icons/hicolor/128x128/apps/wuddle.png' package-contents.txt
          grep -Fx './wuddle' package-contents.txt
          grep -Fx './wuddle-bin' package-contents.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iced-linux
          path: |
            wuddle-*-linux-x86_64.AppImage
            wuddle-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows portable zip
  # ------------------------------------------------------------------
  build-windows:
    needs: [guard, validate-release]
    if: needs.guard.outputs.should_build == 'true'
    name: Windows (portable zip)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            wuddle-iced -> target
            wuddle-engine -> target
            wuddle-launcher -> target

      - name: Build Wuddle (Iced) and launcher
        run: |
          cargo test --locked --manifest-path wuddle-iced/Cargo.toml
          cargo test --locked --manifest-path wuddle-launcher/Cargo.toml
          cargo build --locked --release --manifest-path wuddle-iced/Cargo.toml
          cargo build --locked --release --manifest-path wuddle-launcher/Cargo.toml

      - name: Show sccache stats
        shell: pwsh
        run: |
          & $env:SCCACHE_PATH --show-stats

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = $env:WUDDLE_BUILD_TAG
          # Launcher-layout: Wuddle.exe is the launcher, the Iced binary lives in
          # versions/<tag>/Wuddle-bin.exe so Tauri v2's self-update flow works seamlessly.
          $versionDir = "dist\versions\$tag"
          New-Item -ItemType Directory -Path $versionDir -Force | Out-Null
          Copy-Item "wuddle-launcher\target\release\wuddle-launcher.exe" "dist\Wuddle.exe" -Force
          Copy-Item "wuddle-iced\target\release\wuddle.exe" "$versionDir\Wuddle-bin.exe" -Force
          @{ current = $tag } | ConvertTo-Json | Set-Content "dist\current.json"
          Set-Content "dist\README.txt" @"
          Wuddle (Windows, Iced v3)
          ================================
          Run: Wuddle.exe

          Layout:
            Wuddle.exe                          <- launcher (run this)
            versions\$tag\Wuddle-bin.exe        <- Iced v3 binary
            current.json                        <- active version pointer
            wuddle-data\settings.json           <- settings (created on first run)
            wuddle-data\wuddle*.sqlite          <- profile databases

          Upgrading from Wuddle v2 (Tauri):
            If you already have a v2 portable install, just unzip this into the
            same folder. The launcher will switch to v3 automatically.

          Windows storage:
            Wuddle keeps settings and profile databases in wuddle-data beside
            Wuddle.exe. On first launch, existing data from %APPDATA%\wuddle is
            copied here automatically. The AppData copy is kept as a backup.

            If this folder is read-only, set WUDDLE_DATA_DIR to one writable
            directory before starting Wuddle. GitHub tokens remain protected by
            Windows Credential Manager and are not stored in wuddle-data.
          "@
          Compress-Archive -Path "dist\*" -DestinationPath "wuddle-$tag-windows-x86_64.zip" -Force

      - name: Smoke-test Windows package
        shell: pwsh
        run: |
          $tag = $env:WUDDLE_BUILD_TAG
          $archive = "wuddle-$tag-windows-x86_64.zip"
          $smokeDir = "package-smoke"
          Expand-Archive -Path $archive -DestinationPath $smokeDir -Force
          $launcher = Join-Path $smokeDir "Wuddle.exe"
          $runtime = Join-Path $smokeDir "versions\$tag\Wuddle-bin.exe"
          if (-not (Test-Path $launcher -PathType Leaf)) { throw "Wuddle.exe is missing" }
          if (-not (Test-Path $runtime -PathType Leaf)) { throw "Wuddle-bin.exe is missing" }
          if ((Get-Content (Join-Path $smokeDir "current.json") | ConvertFrom-Json).current -ne $tag) {
            throw "current.json does not select the packaged version"
          }
          foreach ($binary in @($launcher, $runtime)) {
            $signature = [System.IO.File]::ReadAllBytes($binary)[0..1]
            if ($signature[0] -ne 0x4d -or $signature[1] -ne 0x5a) {
              throw "$binary is not a Windows PE executable"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iced-windows
          path: wuddle-*-windows-x86_64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish pre-release on GitHub
  # ------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: iced-*
          path: dist
          merge-multiple: true

      - name: Extract changelog section
        run: |
          python3 .github/scripts/validate_release.py \
            "${WUDDLE_BUILD_TAG}" --notes > dist/RELEASE_BODY.md

      - name: Publish pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
