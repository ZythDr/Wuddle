[package]
name = "wuddle-engine"
version = "0.1.3"
description = "Core engine for the Wuddle legacy World of Warcraft launcher and manager"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZythDr/Wuddle"
publish = false

[features]
default = []
auto-login = [
    "dep:keyring",
    "dep:secrecy",
    "dep:thiserror",
    "dep:uuid",
    "dep:zeroize",
]

[lib]
name = "wuddle_engine"
path = "src/lib.rs"

[[bin]]
name = "wuddle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
zip = "2"
sevenz-rust = "0.6"
sha2 = "0.10"
hex = "0.4"
url = "2"
urlencoding = "2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }
tempfile = "3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native"], optional = true }
secrecy = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
junction = "1"
